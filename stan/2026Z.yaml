# Stan planu na semestr zimowy 2026/27 — rzeczy, które zmieniają się w trakcie
# ustalania planu: status negocjacji, sprawy do załatwienia, niepewności.
# Dane trwałe (nazwy kierunków, URL-e, osoby kontaktowe) → kierunki.yaml.

rok: "2026/27"
semestr: Z                       # Z = zimowy, L = letni
prowadzacy: "Maciej Karczewski"
stan_zrodel: "02.09.2026"        # data ostatniego pobrania / sprawdzenia PDF-ów
stan_zrodel_opis: >-
  OZE: aktualizacja planu 27.08.2026; IBezp: aktualizacja rozkładu 02.09.2026 —
  Analiza ryzyka przeniesiona z wtorku na środę; GP: propozycja 26/27,
  info 14.09.2026 — wykład przeniesiony na pt 11:15–12:00;
  pozostałe pobrane 14.08.2026.
flagi_globalne:
  - "⚠️ Wszystkie plany są jeszcze projektami / propozycjami"

# status: czekam | ustalone | do_zmiany | brak_planu
kierunki:
  GP:
    status: ustalone
    status_opis: "Propozycja 26/27; wykład przeniesiony na pt 11:15. Grupy ćwiczeniowe są łączone — prowadzę wszystkie sloty razem z drugim prowadzącym."
    sprawy: []
  IDSaT:
    status: ustalone
    status_opis: "Projekt planu 13.08.2026. Oba sloty ćwiczeń (pon gr 1 / pt gr 2–3) są łączone i moje."
    sprawy:
      - "Znaleźć osobę kontaktową ws. planu na IDSaT (kierunki.yaml → kontakt)."
  IBezp:
    status: ustalone
    status_opis: "Projekt rok IV sem. 7; Analiza ryzyka przeniesiona z wtorku na środę (akt. 02.09.2026). Harmonogram: 12 spotkań po 2h + 2h co dwa tygodnie."
    sprawy:
      - "Znaleźć osobę kontaktową ws. planu na IBezp (kierunki.yaml → kontakt)."
  OZE:
    status: ustalone
    status_opis: "Propozycja, aktualizacja 27.08.2026. Przedmiot docelowo ma tylko jedną grupę ćwiczeniową (błąd w przydziałach — wyjaśnione)."
    sprawy: []

# Niepewności merytoryczne (godziny vs przydział) — pokazywane w zakładce Konflikty.
niepewnosci: []

# Notatki ogólne — nieprzypisane do kierunku.
notatki:
  - "Preferowane duże sale dla łączonych grup; wymagane oprogramowanie statystyczne w salach komputerowych."
  - "Optymalizacja planu — unikać wczesnych godzin i dużych przerw między blokami."
  - "Strony UPWr blokują automatyczne pobieranie (Anubis) — PDF-y ściągać ręcznie przez przeglądarkę."
